[project]
name = "supplier-catalog-intelligence"
version = "0.1.0"
description = "Source-linked supplier product comparisons"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "PyMuPDF>=1.24", "Pillow>=10"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "opencv-python-headless>=4.9"]
test = ["pytest>=8"]

[project.scripts]
catalog-intel = "catalog_intel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catalog_intel*"]
